name: 🐞 Bug 报告
description: 报告可复现的缺陷（判分错误、崩溃、报告异常、安装失败等）
title: '[Bug] '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。LeziBench 是**本地公开题库自测工具**——判分器、题库、答案都在客户端，
        所以「可复现的信息」是定位问题的唯一依据。下面几项缺一项，我们大概率只能回你一句「无法复现」。

        > ⚠️ **贴日志 / 截图前请先脱敏：**
        > **不要贴真实成绩里的个人路径**（例如 `C:\Users\你的名字\...`、`/home/你的名字/...`）。
        > 请替换成 `<我的用户名>` 或 `<HOME>`。数据目录里的 `runId`、seed、答案内容可以保留。

        ---

        **在提交之前请先确认：**

        - 我已经读过 [docs/COMPATIBILITY.md](https://github.com/tbj0623/lezibench/blob/main/docs/COMPATIBILITY.md)，
          我用的平台在证据表里是什么状态。
        - 这不是「改 `state.json` / 改判分器就能改分」这类**已知且接受**的边界
          （见 [SECURITY.md §4](https://github.com/tbj0623/lezibench/blob/main/SECURITY.md)）。
        - 这不是「题库是公开的」或「不能防作弊」这类设计取舍。

  - type: input
    id: node-version
    attributes:
      label: Node 版本
      description: 请贴 `node --version` 的完整原始输出，不要只写「最新版」。
      placeholder: v24.20.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统与架构
      description: 请贴 `process.platform` / `process.arch` 的值，或写清系统版本。
      placeholder: Windows 11 23H2 · win32 / x64（或 macOS 15.1 / darwin / arm64、Ubuntu 24.04 / linux / x64）
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: 安装方式
      description: 你是怎么把它放进 Agent 里的？
      options:
        - 用户级 Skill（~/.agents/skills/lezi-bench）
        - 项目级 Skill（<project>/.agents/skills/lezi-bench）
        - 安装器 install.ps1 / install.sh
        - 直接用 CLI（不装成 Skill）
        - 直接 git clone 后跑测试
        - 其它（请在「补充信息」里说明）
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: 宿主 / Agent 平台
      description: |
        OpenClaw 与 Codex 目前是 **NOT_TESTED**（见 docs/COMPATIBILITY.md）。
        如果你在它们上面跑出了问题，这本身是有价值的信息，请照实选。
      options:
        - DSH（DeepSeek Harness）
        - 其它兼容 Agent Skills 规范的宿主
        - OpenClaw
        - Codex
        - 只用 CLI，不经过 Agent 宿主
        - 不确定
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: doctor 输出
      description: |
        请贴 `node scripts/cli.mjs doctor` 的**完整输出**。这一项能一次排除掉大半环境问题。
        记得把路径里的个人用户名替换掉。
      render: shell
      placeholder: |
        $ node scripts/cli.mjs doctor
        LeziBench 环境自检（数据目录：<HOME>/AppData/Local/LeziBench）
          ✔ Node.js 版本：v24.20.0（要求 ≥18）
          ✔ 操作系统：win32 x64
          ✔ 题库契约：16 题 / 100 分 / 4 维 × 25 / xxxxxxxxxxxx…
          ✔ 数据目录可写：<HOME>/AppData/Local/LeziBench
          ✔ 哈希与编码：SHA-256 正常，UTF-8 输出正常

        全部通过，可以开考。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现命令
      description: |
        能跑出问题的最小命令序列。请逐行贴出，不要写「同上」「正常操作」。
        如果涉及答案文件，请贴出**内容（可脱敏）**而不只是文件名。
      render: shell
      placeholder: |
        node scripts/cli.mjs start --mode standard --seed 42 --json
        # 记下 runId
        node scripts/cli.mjs submit --run <RUN_ID> --batch 1 --answers-file answers.json
        node scripts/cli.mjs report --run <RUN_ID> --format html
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？如果涉及分数，请写清期望得分与依据（哪个条件该通过/不通过）。
      placeholder: |
        期望 I01 得 4 分。我交了 {"deadline":"周三上午10点","budgetAttached":false}，
        题面写的是「周三上午10点截止」，两个条件都应通过。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: |
        实际发生了什么？请贴**原始输出/错误栈**，不要只写「报错了」「分数不对」。
        如果是判分问题，请贴出报告里的逐条 checks。
      render: shell
      placeholder: |
        实际 I01 只得 1 分，报告里显示：
        - I01.C1 [FAIL] 截止时间不符（识别到「周三」，期望「周四」）
    validations:
      required: true

  - type: input
    id: seed
    attributes:
      label: seed 与 runId（判分类问题必填）
      description: |
        `start` 时用的 seed（或报告里的 seed）与 runId。有了这两个我们能逐字节复现题面。
      placeholder: seed=42 · run-20261030-003000-a1b2c3

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: |
        其它可能有用的东西：完整错误栈、报告 HTML 片段（脱敏后）、
        是否可稳定复现、是否换 seed 后仍出现、你怀疑的原因。
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已经把日志里的个人路径、用户名、主机名替换成占位符
          required: true
        - label: 我已经确认这不是 SECURITY.md §4 里列出的已知边界
          required: true
        - label: 我贴出的内容里不包含任何真实 token、私钥或他人隐私
          required: true
