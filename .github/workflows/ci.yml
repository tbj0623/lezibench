name: CI

# 三条硬性约束，改这个文件前先读：
#   1. 不需要任何 secret（fork 的 PR 也必须能跑全绿）。
#   2. 矩阵里的 Node 版本必须和 docs/COMPATIBILITY.md §1 的说法一致，
#      不能因为「本地只在 24 上跑过」就把低版本从矩阵里删掉。
#   3. 任何一步失败都必须让 job 变红，不允许 continue-on-error 兜底。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 全量验证：单元 + 契约 + 回归 → 端到端 → 变异测试
  # ------------------------------------------------------------------
  test:
    name: node ${{ matrix.node }} · 全量测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 测试只往这个目录写探针与运行记录，避免落到 runner 的默认用户目录。
      # 用 $RUNNER_TEMP 而不是 ${{ runner.temp }}：后者在 workflow / job 级 env
      # 的上下文可用性表里不存在，只在 step 里可用；这一步把它写进 GITHUB_ENV 最稳。
      - name: 准备隔离的数据目录
        shell: bash
        run: echo "LEZIBENCH_HOME=$RUNNER_TEMP/lezibench-ci-data" >> "$GITHUB_ENV"

      # 失败时第一眼要能确认到底跑在哪个版本上，所以显式打印一次。
      - name: 打印环境
        run: |
          node --version
          npm --version

      # 这里故意不写引号：Node 18 / 20 的 `node --test` 不会自己展开 glob
      # （`node --test "tests/*.test.mjs"` 在 18/20 上会报 Could not find），
      # 由 bash 展开成文件列表后，三条 Node 版本跑的是同一批文件。
      - name: 单元 / 契约 / 回归测试
        shell: bash
        run: node --test tests/*.test.mjs

      - name: 端到端（满分卷 / 全错卷 / 部分卷 / 幂等 / 路径安全）
        run: node tests/e2e-run.mjs

      - name: 变异测试（证明测试真的会失败）
        run: node tests/mutation.mjs

      # 红队套件只在 Node 20 上跑一次（矩阵里其它版本跑全量单测即可，避免三倍耗时）。
      # 用 glob 而不是逐个列文件：将来 evidence/ 下新增 *.test.mjs 不用改 workflow。
      # --test-timeout=300000 必须有：这几个套件要跑几分钟，默认超时会误判成失败。
      - name: 红队套件（evidence/）
        if: matrix.node == '20'
        shell: bash
        run: |
          node --test --test-timeout=300000 evidence/*.test.mjs
          node evidence/mutation-check.mjs

      - name: 题库自检（doctor）
        run: node scripts/cli.mjs doctor

  # ------------------------------------------------------------------
  # 跨平台最低验证：只跑 node --test，证明代码路径不依赖 Windows 专有行为
  # 注意：这两个平台**没有**跑过完整 16 题真机考试，见 docs/COMPATIBILITY.md。
  # ------------------------------------------------------------------
  cross-platform:
    name: ${{ matrix.os }} · 单测
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 准备隔离的数据目录
        run: echo "LEZIBENCH_HOME=$RUNNER_TEMP/lezibench-ci-data" >> "$GITHUB_ENV"

      - name: 打印环境
        run: |
          node --version
          uname -a

      - name: 单元 / 契约 / 回归测试
        run: node --test tests/*.test.mjs

  # ------------------------------------------------------------------
  # 敏感信息扫描：防止把真实 token / 私钥误提交
  # ------------------------------------------------------------------
  secret-scan:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 扫描疑似密钥与私钥
        shell: bash
        run: |
          # 说明：本文件自身就含有下面这个正则的字面量（否则没法维护正则），
          # 必须把自己排除掉，否则这一步永远命中自己、永远失败。
          set +e
          hits=$(git grep --untracked -nEi \
            "(ghp_|github_pat_|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN .*PRIVATE KEY)" \
            -- . ':(exclude).github/workflows/ci.yml')
          rc=$?
          set -e

          # git grep 的退出码：0=有命中，1=无命中，其它=执行出错。
          if [ "$rc" -eq 0 ]; then
            echo "::error::检测到疑似密钥 / 私钥内容："
            echo "$hits"
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::git grep 执行失败（退出码 $rc），无法完成扫描。"
            exit "$rc"
          fi
          echo "未发现疑似密钥或私钥。"
